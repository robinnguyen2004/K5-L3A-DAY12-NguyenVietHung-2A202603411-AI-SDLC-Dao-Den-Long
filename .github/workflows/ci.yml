name: verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (contract)
        run: python3 -m unittest discover -s tests -v
      - name: Full verification (headless CLI, determinism, autopilot)
        run: python3 tools/verify.py
      - name: Contract headless_cmd smoke test
        run: |
          cmd=$(python3 -c "import json;print(json.load(open('game.contract.json'))['headless_cmd'])")
          $cmd --seed 3 --night 1 --ticks 600 --out out.jsonl
          tail -n 1 out.jsonl
